name: Dohvati uzorke HTML-a

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uzorci:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi stranice
        run: |
          mkdir -p uzorci && cd uzorci
          UA="NovogradnjaZadarBot/0.1 (+https://github.com/steph1804/novi-stanovi-zadar)"
          get() { curl -sSL -m 30 -A "$UA" -o "$1" "$2" || echo "FAIL $2" >> greske.txt; }
          get artis-robots.txt https://www.artis-nekretnine.hr/robots.txt
          get artis-lista.html https://www.artis-nekretnine.hr/hr/stanovi-zadar-novogradnja
          get artis-lista-en.html https://www.artis-nekretnine.hr/en/flats-zadar-new-construction
          get artis-oglas.html https://www.artis-nekretnine.hr/en/flats/zadar-belafuza-three-bedroom-apartment-parking-garden
          get toplok-robots.txt https://www.toplokacija-nekretnine.com/robots.txt
          get toplok-pocetna.html https://www.toplokacija-nekretnine.com/en
          get toplok-lista.html https://www.toplokacija-nekretnine.com/en/apartments
          get toplok-oglas.html https://www.toplokacija-nekretnine.com/en/flats/plovanija-new-apartment-2026-for-sale-fully-furnished
          ls -la
      - name: Spremi na granu uzorci
        run: |
          cd uzorci
          git init -q -b uzorci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Uzorci HTML-a"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" uzorci
